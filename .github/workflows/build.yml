name: Build Signed Release APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-release:
    name: Build Knach Taqdia Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate Semantic Decimal Version from Run Number
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-1}
          TOTAL=$((100 + RUN_NUM))
          MAJOR=$((TOTAL / 100))
          MINOR=$(((TOTAL % 100) / 10))
          PATCH=$((TOTAL % 10))
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION_CODE=${RUN_NUM}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Computed Version: v${VERSION_NAME} (versionCode=${RUN_NUM})"

      - name: Decode Release Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not set in GitHub repository secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # Ensure fallback debug.keystore also exists if referenced by Gradle configuration
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            cat debug.keystore.base64 | tr -d '[:space:]' | base64 --decode > debug.keystore
          fi

      - name: Grant Execute Permission to gradlew & Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Sign, Verify & Rename APK with Version Name
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          FINAL_APK_NAME="Knach-Taqdia-v${VERSION_NAME}-release.apk"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$FINAL_APK_NAME" \
            "$APK_SOURCE"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK_NAME"
          echo "FINAL_APK_PATH=${FINAL_APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knach-Taqdia-v${{ env.VERSION_NAME }}-release
          path: ${{ env.FINAL_APK_PATH }}
          if-no-files-found: error

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
